<!DOCTYPE html>
<html>

<head>
    <title>Simple Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 400px;
            max-width: 100%;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #292d3e;
            letter-spacing: 1px;
        }

        h1::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            margin: 10px auto 0;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        input {
            width: 100%;
            height: 55px;
            margin: 8px 0;
            padding: 0 18px;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            outline: none;
            font-size: 17px;
            color: #333;
            background: #f8f9ff;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        input::placeholder {
            color: #999;
        }

        form {
            text-align: center;
        }

        button {
            width: 70px;
            height: 55px;
            margin: 22px 4px 5px;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button[value="+"] {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        button[value="-"] {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }

        button[value="*"] {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
        }

        button[value="/"] {
            background: linear-gradient(135deg, #4776e6, #8e54e9);
        }

        .result {
            margin-top: 28px;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            font-size: 21px;
            font-weight: 600;
            color: #292d3e;
            background: linear-gradient(135deg, #f1f3ff, #f8f0ff);
            border: 1px solid #e3e5ff;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <form method="POST">

            <input type="number" name="num1"
                   placeholder="Enter first number"
                   step="any" required>

            <input type="number" name="num2"
                   placeholder="Enter second number"
                   step="any" required>

            <br>

            <button type="submit" name="operation" value="+">+</button>

            <button type="submit" name="operation" value="-">-</button>

            <button type="submit" name="operation" value="*">*</button>

            <button type="submit" name="operation" value="/">/</button>

        </form>

        <div class="result">
            Result: {{ result }}
        </div>

    </div>

</body>

</html>
